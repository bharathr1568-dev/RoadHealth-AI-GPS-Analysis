services:
  - type: web
    name: roadhealth-ai
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install --upgrade pip && pip install torch==2.7.1 torchvision==0.22.1 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_BACKEND
        value: local
      - key: SECRET_KEY
        generateValue: true
      - key: OFFICER_EMAIL
        sync: false
      - key: OFFICER_NAME
        sync: false
      - key: OFFICER_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
